name: build

on:
  push:
    tags:
      - '*-r*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Rebuild and publish the existing version/revision tag, only when package inputs match"
        type: boolean
        required: false
        default: false

concurrency:
  group: librewolf-${{ github.ref }}
  # Finish the active expensive build; newer runs for the same ref replace the pending run.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      rev: ${{ steps.meta.outputs.rev }}
      package_revision: ${{ steps.meta.outputs.package_revision }}
    runs-on: ${{ vars.LIBREWOLF_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      XBPS_TARGET_ARCH: x86_64-musl
      LIBREWOLF_PGO_CACHE_VERSION: "v13"
    steps:
      - name: free space
        run: |
          set -euo pipefail
          available_kib=$(df --output=avail -k / | tail -1 | tr -d " ")
          if [ "$available_kib" -lt $((60 * 1024 * 1024)) ]; then
            echo "Less than 60 GiB available; reclaiming runner disk space..."
            sudo rm -rf -- \
              /usr/share/dotnet \
              /usr/share/swift \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/.ghcup \
              /usr/local/share/boost \
              /usr/local/graalvm \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /usr/local/lib/node_modules
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force
            fi
          else
            echo "Skipping runner cleanup; sufficient free space is already available."
          fi
          df -h /

      - name: checkout librewolf-void
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: prepare Mozilla nsinstall source
        run: |
          set -euo pipefail
          bash -n .github/scripts/prepare-source-fallbacks.sh
          bash .github/scripts/prepare-source-fallbacks.sh


      - name: derive reproducible build epoch
        id: build-epoch
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct -- srcpkgs/librewolf)"
          [[ "$epoch" =~ ^[0-9]+$ ]] || {
            echo "could not derive a stable build epoch from package inputs" >&2
            exit 1
          }
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "Firefox build date epoch: $epoch"

      - name: checkout void-packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: overlay LibreWolf package into void-packages
        run: |
          set -euo pipefail
          rm -rf void-packages/srcpkgs/librewolf
          cp -a srcpkgs/librewolf void-packages/srcpkgs/librewolf

      - name: validate and prepare package metadata
        id: meta
        env:
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          bash -n .github/scripts/validate-template.sh
          bash -n .github/scripts/validate-workflow.sh
          bash -n .github/scripts/sign-xbps-repository.sh
          bash .github/scripts/validate-template.sh srcpkgs/librewolf/template void-packages/srcpkgs/rust/template void-packages/srcpkgs/wasi-sdk/template
          bash .github/scripts/validate-workflow.sh .github/workflows/main.yml

      - name: fingerprint PGO build inputs
        id: pgo-key
        run: |
          set -euo pipefail
          # Packaging-only revision bumps do not change the generated profile.
          template_hash="$(sed '/^revision=/d' srcpkgs/librewolf/template | sha256sum | awk '{print $1}')"
          echo "template_hash=$template_hash" >> "$GITHUB_OUTPUT"

      - name: restore LibreWolf PGO profile
        id: pgo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: void-packages/hostdir/pgo-cache
          # PGO validity follows source + downstream patches + this explicit version.
          # Bump LIBREWOLF_PGO_CACHE_VERSION when profile-relevant build/workload inputs change.
          key: librewolf-pgo-${{ env.LIBREWOLF_PGO_CACHE_VERSION }}-${{ steps.meta.outputs.sha256 }}-${{ steps.pgo-key.outputs.template_hash }}-${{ hashFiles('srcpkgs/librewolf/patches/**', 'srcpkgs/librewolf/files/stab.h', 'void-packages/srcpkgs/llvm23/template', 'void-packages/srcpkgs/rust/template', 'void-packages/srcpkgs/cargo/template', 'void-packages/srcpkgs/wasi-sdk/template', 'void-packages/srcpkgs/rust-sccache/template', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: prepare xbps-static
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output xbps-static-latest.x86_64-musl.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm -f xbps-static-latest.x86_64-musl.tar.xz

      - name: allow xbps user namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # GitHub cache entries are immutable; rotate weekly so newer Void packages
      # are captured instead of repeatedly restoring a stale dependency snapshot.
      - name: prepare Void binary package cache epoch
        id: void-cache-epoch
        run: echo "week=$(date -u +'%G-W%V')" >> "$GITHUB_OUTPUT"

      - name: restore Void binary package cache
        id: xbps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v3-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}-${{ steps.void-cache-epoch.outputs.week }}
          restore-keys: |
            void-repocache-v3-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}-
            void-repocache-v2-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: bootstrap xbps-src
        timeout-minutes: 15
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap

      - name: restore sccache object cache
        id: sccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: void-packages/hostdir/sccache
          # A unique key permits new objects to be saved after each build.
          key: sccache-disk-v1-${{ runner.os }}-${{ env.XBPS_TARGET_ARCH }}-skylake-llvm23-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-disk-v1-${{ runner.os }}-${{ env.XBPS_TARGET_ARCH }}-skylake-llvm23-

      - name: restore LibreWolf source
        id: source-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v7-${{ steps.meta.outputs.sha256 }}

      - name: fetch and verify LibreWolf source
        timeout-minutes: 20
        working-directory: void-packages
        env:
          DISTFILE: ${{ steps.meta.outputs.distfile }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          srcdir="hostdir/sources/librewolf-${VERSION}"
          distfile="${srcdir}/${DISTFILE}"
          mkdir -p "$srcdir"

          cache_valid=false
          if [ "${{ steps.source-cache.outputs.cache-hit }}" = "true" ] && [ -s "$distfile" ]; then
            echo "LibreWolf source cache hit; verifying cached archive..."
            if printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check --status -; then
              cache_valid=true
            else
              echo "Cached source failed SHA-256 verification; refetching." >&2
            fi
          fi

          if [ "$cache_valid" != "true" ]; then
            rm -f -- "$distfile"
            echo "Fetching LibreWolf source through xbps-src..."
            ./xbps-src -A "$XBPS_TARGET_ARCH" fetch librewolf
          fi

          test -s "$distfile"
          printf '%s  %s\n' "$SHA256" "$distfile" | sha256sum --check -

      - name: save LibreWolf source
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: void-packages/hostdir/sources/librewolf-${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.distfile }}
          key: librewolf-source-v7-${{ steps.meta.outputs.sha256 }}

      - name: build package
        timeout-minutes: 350
        working-directory: void-packages
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"
          printf '%s\n' "${SOURCE_DATE_EPOCH:?missing reproducible build epoch}" > hostdir/source-date-epoch
          chmod 644 hostdir/source-date-epoch
          rm -f hostdir/sccache-error.log

          # Reserve 1.5 GiB for the OS/linker and budget about 3 GiB per worker.
          cpu_jobs="$(nproc)"
          available_kib="$(awk '/^MemAvailable:/ { print $2; exit }' /proc/meminfo)"
          reserved_kib=$((1536 * 1024))
          per_job_kib=$((3 * 1024 * 1024))
          if [ "$available_kib" -gt "$reserved_kib" ]; then
            memory_jobs=$(((available_kib - reserved_kib) / per_job_kib))
          else
            memory_jobs=1
          fi
          [ "$memory_jobs" -ge 1 ] || memory_jobs=1
          build_jobs="$cpu_jobs"
          [ "$memory_jobs" -ge "$build_jobs" ] || build_jobs="$memory_jobs"

          echo "Build parallelism: $build_jobs jobs ($cpu_jobs CPUs, $((available_kib / 1024)) MiB available RAM)."
          # PGO is part of every build; the package template safely falls back
          # to the LTO-only configuration if profile generation/use fails.
          pgo_options=(-o pgo)
          echo "PGO enabled for this build."
          ./xbps-src -A "$XBPS_TARGET_ARCH" "${pgo_options[@]}" pkg -j"$build_jobs" librewolf

      - name: report compiler cache diagnostics
        if: ${{ always() }}
        working-directory: void-packages
        run: |
          set -euo pipefail
          if [ -s hostdir/sccache-error.log ]; then
            echo "sccache backend diagnostics:"
            tail -n 100 hostdir/sccache-error.log
          else
            echo "No sccache backend errors were logged."
          fi

      - name: save sccache object cache
        if: ${{ always() && !cancelled() && steps.sccache-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: void-packages/hostdir/sccache
          key: ${{ steps.sccache-cache.outputs.cache-primary-key }}

      - name: save LibreWolf PGO profile
        if: ${{ always() && !cancelled() && steps.pgo-cache.outputs.cache-hit != 'true' && hashFiles('void-packages/hostdir/pgo-cache/merged.profdata') != '' && hashFiles('void-packages/hostdir/pgo-cache/jarlog') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: void-packages/hostdir/pgo-cache
          key: librewolf-pgo-${{ env.LIBREWOLF_PGO_CACHE_VERSION }}-${{ steps.meta.outputs.sha256 }}-${{ steps.pgo-key.outputs.template_hash }}-${{ hashFiles('srcpkgs/librewolf/patches/**', 'srcpkgs/librewolf/files/stab.h', 'void-packages/srcpkgs/llvm23/template', 'void-packages/srcpkgs/rust/template', 'void-packages/srcpkgs/cargo/template', 'void-packages/srcpkgs/wasi-sdk/template', 'void-packages/srcpkgs/rust-sccache/template', 'void-packages/srcpkgs/base-chroot/template') }}

      - name: save Void binary package cache
        if: ${{ always() && !cancelled() && steps.void-cache-epoch.outputs.week != '' && steps.xbps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: void-packages/hostdir/repocache-${{ env.XBPS_TARGET_ARCH }}
          key: void-repocache-v3-${{ env.XBPS_TARGET_ARCH }}-${{ hashFiles('void-packages/xbps-src', 'void-packages/srcpkgs/base-chroot/template') }}-${{ steps.void-cache-epoch.outputs.week }}

      - name: stage LibreWolf package
        working-directory: void-packages/hostdir/binpkgs/
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(librewolf-*.xbps)
          [ "${#packages[@]}" -gt 0 ] || {
            echo "no LibreWolf XBPS package was produced" >&2
            exit 1
          }
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp -- "${packages[@]}" "$GITHUB_WORKSPACE/release-assets/"

      - name: upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: librewolf-packages
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      XBPS_TARGET_ARCH: x86_64-musl
    steps:
      - name: checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: librewolf-packages
          path: binpkgs

      - name: prepare xbps-rindex
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output xbps-static-latest.x86_64-musl.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf xbps-static-latest.x86_64-musl.tar.xz -C /opt/xbps
          rm -f -- xbps-static-latest.x86_64-musl.tar.xz
          echo "/opt/xbps/usr/bin" >> "$GITHUB_PATH"

      - name: verify release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ needs.build.outputs.release_tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${TAG}"
          git show-ref --verify --quiet "$tag_ref" || {
            echo "release tag does not exist locally: $TAG" >&2
            exit 1
          }
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          if [ "$EVENT_NAME" = "push" ]; then
            [ "$tag_commit" = "$EXPECTED_SHA" ] || {
              echo "release tag does not point at the commit that triggered this build" >&2
              exit 1
            }
          else
            # Manual publication is permitted only for a tag with identical package
            # recipe and source-fallback inputs. Workflow/docs-only changes are safe.
            git diff --quiet "$tag_commit" "$EXPECTED_SHA" -- \
              srcpkgs/librewolf \
              .github/scripts/prepare-source-fallbacks.sh || {
              echo "refusing manual publication: package or source-fallback inputs differ from $TAG" >&2
              exit 1
            }
          fi
          echo "Verified release tag $TAG at $tag_commit."

      - name: protect existing release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            previous_dir="$(mktemp -d "$RUNNER_TEMP/librewolf-release.XXXXXX")"
            trap 'rm -rf -- "$previous_dir"' EXIT
            gh release download "$TAG" --pattern 'librewolf-*.xbps' --dir "$previous_dir"

            shopt -s nullglob
            current_packages=(binpkgs/librewolf-*.xbps)
            previous_packages=("$previous_dir"/librewolf-*.xbps)
            [ "${#current_packages[@]}" -gt 0 ] &&
              [ "${#current_packages[@]}" -eq "${#previous_packages[@]}" ] || {
              echo "existing release package set differs from the newly built package set" >&2
              exit 1
            }
            for package in "${current_packages[@]}"; do
              previous="$previous_dir/${package##*/}"
              [ -s "$previous" ] && cmp -s "$package" "$previous" || {
                echo "refusing to replace an existing release with different package bytes: ${package##*/}" >&2
                echo "bump the package revision and publish a new tag instead." >&2
                exit 1
              }
            done
            echo "Existing release package payload is byte-identical; signing metadata can be refreshed."
          else
            echo "No existing release assets to protect for $TAG."
          fi

      - name: sign XBPS repository
        working-directory: binpkgs
        env:
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
          SIGNEDBY: ${{ vars.SIGNEDBY }}
          XBPS_TARGET_ARCH: ${{ env.XBPS_TARGET_ARCH }}
        run: |
          set -euo pipefail
          bash ../.github/scripts/sign-xbps-repository.sh

      - name: attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: binpkgs/librewolf-*.xbps

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
          REV: ${{ needs.build.outputs.rev }}
          PKG_REV: ${{ needs.build.outputs.package_revision }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its signed repository assets."
          else
            gh release create "$TAG" \
              --title "$VERSION (package revision $PKG_REV)" \
              --notes "https://librewolf.dev/librewolf/source/releases/tag/${VERSION}-${REV}" \
              --latest=false
          fi

      - name: upload signed XBPS repository
        working-directory: binpkgs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(./librewolf-*.xbps)
          signatures=(./librewolf-*.xbps.sig2)
          repo_indexes=(./*-repodata)
          [ "${#packages[@]}" -gt 0 ] || {
            echo "no LibreWolf package archives found" >&2
            exit 1
          }
          [ "${#signatures[@]}" -eq "${#packages[@]}" ] || {
            echo "package signature count does not match package count" >&2
            exit 1
          }
          [ "${#repo_indexes[@]}" -eq 1 ] || {
            echo "expected exactly one x86_64-musl repository index" >&2
            exit 1
          }
          [ -s SHA256SUMS ] || {
            echo "signed repository checksum manifest is missing" >&2
            exit 1
          }
          sha256sum --check SHA256SUMS
          assets=("${packages[@]}" "${signatures[@]}" "${repo_indexes[@]}" ./SHA256SUMS)
          gh release upload "$TAG" --clobber "${assets[@]}"

      - name: mark release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.build.outputs.release_tag }}" --latest
